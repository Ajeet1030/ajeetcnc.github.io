<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Thappad Queen — Slap Game</title>
<style>
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe UI',system-ui,sans-serif;
    background:#221207;
    color:#fff7ea;
    display:flex;justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    width:100%;max-width:920px;height:100vh;height:100dvh;
    display:flex;flex-direction:column;box-sizing:border-box;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    gap:8px;user-select:none;-webkit-user-select:none;
  }
  /* ---------- HUD ---------- */
  .hud{display:flex;gap:8px;}
  .stat{
    flex:1;background:#3a2410;border:2px solid #6b4423;border-radius:14px;
    text-align:center;padding:5px 4px 7px;min-width:0;
  }
  .stat .lbl{font-size:11px;letter-spacing:2px;color:#f0c98a;font-weight:700;}
  .stat .num{font-size:clamp(22px,4.5vmin,34px);font-weight:900;color:#ffd93c;line-height:1.05;}
  .stat .num.white{color:#fff7ea;}
  .meterRow{display:flex;align-items:center;gap:10px;}
  .meterRow .mlbl{font-size:12px;letter-spacing:2px;font-weight:800;color:#ffb3a0;white-space:nowrap;}
  .meter{
    flex:1;height:22px;background:#3a2410;border:2px solid #6b4423;
    border-radius:999px;overflow:hidden;
  }
  #meterFill{
    height:100%;width:0%;border-radius:999px;
    background:hsl(45 95% 55%);
    transition:width .12s ease-out;
  }
  .meter.hot{animation:meterPulse .3s infinite alternate;}
  @keyframes meterPulse{from{box-shadow:0 0 0 rgba(255,60,0,0);}to{box-shadow:0 0 14px rgba(255,60,0,.9);}}
  #meterPct{font-weight:900;color:#ffd93c;min-width:44px;text-align:right;font-size:15px;}
  /* ---------- Stage ---------- */
  #stage{
    position:relative;flex:none;margin:auto;
    width:min(100%, calc((100vh - 218px) * 1.5385));
    width:min(100%, calc((100dvh - 218px) * 1.5385));
    aspect-ratio:800/520;border-radius:18px;overflow:hidden;
    border:3px solid #6b4423;background:#ffe1a8;touch-action:manipulation;
  }
  #stage svg{width:100%;height:100%;display:block;}
  #stage.fever{animation:feverPulse .45s ease-in-out infinite alternate;}
  @keyframes feverPulse{
    from{box-shadow:inset 0 0 22px rgba(255,80,0,.25);}
    to{box-shadow:inset 0 0 64px rgba(255,40,0,.75);}
  }
  #combo{
    position:absolute;top:10px;left:50%;transform:translateX(-50%) scale(.6);
    background:#e63950;color:#fff;font-weight:900;letter-spacing:1px;
    font-size:clamp(16px,3.6vmin,24px);padding:6px 18px;border-radius:999px;
    border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.3);
    opacity:0;pointer-events:none;z-index:6;white-space:nowrap;
    transition:opacity .15s,transform .15s;
  }
  #combo.show{opacity:1;transform:translateX(-50%) scale(1);}
  #combo.feverCombo{background:#ff6a00;}
  #popups{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden;}
  .pop{
    position:absolute;font-weight:900;white-space:nowrap;pointer-events:none;
    text-shadow:3px 3px 0 rgba(60,20,0,.45);
    animation:popfade .72s ease-out forwards;
  }
  @keyframes popfade{
    0%{transform:scale(.3) rotate(var(--r,0deg));opacity:0;}
    22%{opacity:1;}
    55%{transform:scale(1.18) rotate(var(--r,0deg));opacity:1;}
    100%{transform:scale(1) rotate(var(--r,0deg)) translateY(-30px);opacity:0;}
  }
  #lvlBanner{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:7;opacity:0;
  }
  #lvlBanner .card{
    background:rgba(30,16,4,.92);border:3px solid #ffd93c;border-radius:20px;
    padding:18px 34px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  #lvlBanner .big{font-size:clamp(30px,7vmin,52px);font-weight:900;color:#ffd93c;line-height:1;}
  #lvlBanner .sub{font-size:clamp(15px,3.4vmin,21px);color:#fff7ea;margin-top:6px;font-weight:700;}
  #lvlBanner.show{animation:bannerIn 1.6s ease forwards;}
  @keyframes bannerIn{
    0%{opacity:0;transform:scale(.7);}
    15%{opacity:1;transform:scale(1.05);}
    22%{transform:scale(1);}
    82%{opacity:1;}
    100%{opacity:0;transform:scale(1);}
  }
  /* ---------- Controls ---------- */
  .controls{display:flex;gap:8px;align-items:stretch;}
  #slapBtn{
    flex:1;min-height:66px;border:none;border-radius:16px;cursor:pointer;
    background:#e63950;color:#fff;border-bottom:7px solid #a11f33;
    font-family:inherit;font-size:clamp(22px,5vmin,32px);font-weight:900;letter-spacing:.5px;
    touch-action:manipulation;
  }
  #slapBtn:active{transform:translateY(4px);border-bottom-width:3px;}
  .sideBtn{
    width:76px;min-height:66px;border-radius:16px;cursor:pointer;
    background:#3a2410;color:#ffd93c;border:2px solid #6b4423;
    font-family:inherit;font-size:13px;font-weight:800;line-height:1.25;
    touch-action:manipulation;padding:4px;
  }
  .sideBtn:active{background:#54351a;}
  /* ---------- Girl arm & victim animations ---------- */
  #slapArm{transform:rotate(50deg);transform-origin:256px 272px;}
  #slapArm.swing{animation:swing .32s ease-in-out;}
  @keyframes swing{
    0%{transform:rotate(50deg);}
    40%{transform:rotate(-17deg);}
    58%{transform:rotate(-10deg);}
    100%{transform:rotate(50deg);}
  }
  .vHead.shake{animation:hshake .34s linear;}
  @keyframes hshake{
    0%{transform:rotate(0deg);}
    25%{transform:rotate(-9deg);}
    50%{transform:rotate(7deg);}
    75%{transform:rotate(-4deg);}
    100%{transform:rotate(0deg);}
  }
  #victimG.walkin{animation:walkin .55s ease-out;}
  @keyframes walkin{
    0%{transform:translateX(360px);}
    70%{transform:translateX(-14px);}
    100%{transform:translateX(0);}
  }
  #victimG.jump{animation:vjump .65s ease-in-out;}
  @keyframes vjump{
    0%{transform:translateY(0);}
    30%{transform:translateY(-52px);}
    55%{transform:translateY(0);}
    75%{transform:translateY(-22px);}
    100%{transform:translateY(0);}
  }
  .spinOn{animation:spinStars .8s linear infinite;}
  @keyframes spinStars{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  /* ---------- Start overlay ---------- */
  #startOv{
    position:fixed;inset:0;background:rgba(24,12,4,.5);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
    padding:16px 16px calc(104px + env(safe-area-inset-bottom));box-sizing:border-box;
  }
  @media (min-width:700px){
    #startOv{align-items:center;padding:16px;}
  }
  #startOv .card{
    background:#3a2410;border:3px solid #ffd93c;border-radius:24px;
    padding:20px 24px;text-align:center;max-width:420px;width:100%;
    box-shadow:0 16px 40px rgba(0,0,0,.5);
  }
  #startOv h1{margin:0 0 4px;font-size:clamp(30px,7vmin,44px);color:#ffd93c;letter-spacing:1px;}
  #startOv p{margin:6px 0 18px;color:#ffe9c9;font-size:clamp(14px,3.4vmin,17px);line-height:1.45;}
  #startBtn{
    min-height:60px;width:100%;border:none;border-radius:16px;cursor:pointer;
    background:#e63950;color:#fff;border-bottom:6px solid #a11f33;
    font-family:inherit;font-size:clamp(20px,4.6vmin,26px);font-weight:900;
  }
  #startBtn:active{transform:translateY(3px);border-bottom-width:3px;}
  .hidden{display:none !important;}
  @media (max-height:560px){
    .stat .num{font-size:20px;}
    #slapBtn,.sideBtn{min-height:54px;}
    #app{gap:6px;padding-top:6px;}
  }
</style>

function starPoints(cx, cy, r){
  var pts = [], i, a, rr;
  for (i = 0; i < 10; i++){
    a = -Math.PI/2 + i * Math.PI/5;
    rr = (i % 2 === 0) ? r : r * 0.45;
    pts.push((cx + rr * Math.cos(a)).toFixed(1) + "," + (cy + rr * Math.sin(a)).toFixed(1));
  }
  return pts.join(" ");
}

function hairSVG(v){
  var cx = VCX, cy = v.headCy, r = v.headR, col = v.hair, s = "", i, a, x, y;
  if (v.hairType === "tuft"){
    s += '<circle cx="' + (cx - r*0.45) + '" cy="' + (cy - r*0.8) + '" r="8" fill="' + col + '"/>';
    s += '<circle cx="' + cx + '" cy="' + (cy - r*0.94) + '" r="9" fill="' + col + '"/>';
    s += '<circle cx="' + (cx + r*0.45) + '" cy="' + (cy - r*0.8) + '" r="8" fill="' + col + '"/>';
  } else if (v.hairType === "spiky"){
    var pts = [];
    for (i = 0; i <= 6; i++){
      a = Math.PI * (1.08 + i * 0.14);
      var rr = (i % 2 === 0) ? r + 13 : r - 3;
      pts.push((cx + rr * Math.cos(a)).toFixed(1) + "," + (cy + rr * Math.sin(a)).toFixed(1));
    }
    s += '<polygon points="' + pts.join(" ") + '" fill="' + col + '"/>';
  } else if (v.hairType === "side"){
    s += '<path d="M' + (cx - r) + ',' + (cy - 4) + ' A' + r + ',' + r + ' 0 0 1 ' + (cx + r) + ',' + (cy - 4) +
         ' L' + (cx + r) + ',' + (cy - r*0.34) + ' Q' + cx + ',' + (cy - r*1.08) + ' ' + (cx - r) + ',' + (cy - r*0.34) + ' Z" fill="' + col + '"/>';
  } else if (v.hairType === "cap"){
    s += '<path d="M' + (cx - r - 4) + ',' + (cy - 2) + ' A' + (r + 4) + ',' + (r + 4) + ' 0 0 1 ' + (cx + r + 4) + ',' + (cy - 2) + ' Z" fill="#31572c"/>';
    s += '<rect x="' + (cx - r - 20) + '" y="' + (cy - 8) + '" width="' + (r + 14) + '" height="10" rx="5" fill="#22401e"/>';
    s += '<circle cx="' + cx + '" cy="' + (cy - r - 4) + '" r="6" fill="#22401e"/>';
  } else if (v.hairType === "curly"){
    for (i = 0; i < 7; i++){
      a = Math.PI * (1.12 + i * 0.125);
      x = cx + (r - 3) * Math.cos(a); y = cy + (r - 3) * Math.sin(a);
      s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="10.5" fill="' + col + '"/>';
    }
  }
  return s;
}

         '<line x1="' + (cx - 5) + '" y1="' + ey + '" x2="' + (cx + 5) + '" y2="' + ey + '"/></g>';
  }
  if (v.acc === "moustache"){
    s += '<g fill="#33302c"><ellipse cx="' + (cx - 11) + '" cy="' + (cy + r*0.33) + '" rx="12.5" ry="5" transform="rotate(-14 ' + (cx - 11) + ' ' + (cy + r*0.33) + ')"/>' +
         '<ellipse cx="' + (cx + 11) + '" cy="' + (cy + r*0.33) + '" rx="12.5" ry="5" transform="rotate(14 ' + (cx + 11) + ' ' + (cy + r*0.33) + ')"/></g>';
  }
  /* cheek flash + handprint */
  s += '<circle id="cheekRed" cx="' + cheekX + '" cy="' + cheekY + '" r="' + (r*0.42) + '" fill="#ff5a4d" opacity="0" style="transition:opacity .8s"/>';
  s += '<g id="handPrint" opacity="0" style="transition:opacity .8s" transform="translate(' + cheekX + ' ' + cheekY + ') rotate(-18)" fill="#d92b2b">' +
       '<ellipse rx="9" ry="11" cy="4"/>' +
       '<ellipse rx="3" ry="7" cx="-8" cy="-8"/>' +
       '<ellipse rx="3.2" ry="8.5" cx="-2.7" cy="-10.5"/>' +
       '<ellipse rx="3.2" ry="8.5" cx="2.7" cy="-10.5"/>' +
       '<ellipse rx="3" ry="7" cx="8" cy="-8"/>' +
       '<ellipse rx="2.8" ry="6" cx="11.5" cy="2" transform="rotate(40 11.5 2)"/></g>';
  /* tears */
  s += '<g id="tearsG" opacity="0" style="transition:opacity .25s" fill="#57b7e8">' +
       '<path transform="translate(' + (cx - r + 1) + ' ' + (cy + 20) + ')" d="M0,-9 C5,-2 7.5,3 7.5,6.5 A7.5,7.5 0 1 1 -7.5,6.5 C-7.5,3 -5,-2 0,-9 Z"/>' +
       '<path transform="translate(' + (cx + r - 1) + ' ' + (cy + 20) + ')" d="M0,-9 C5,-2 7.5,3 7.5,6.5 A7.5,7.5 0 1 1 -7.5,6.5 C-7.5,3 -5,-2 0,-9 Z"/></g>';
  s += '</g>'; /* head */
  /* spinning stars (shown on level-up) */
  s += '<g id="spinStars" opacity="0" style="transition:opacity .25s;transform-origin:' + cx + 'px ' + cy + 'px" fill="#ffd93c" stroke="#e07b00" stroke-width="2">' +
       '<polygon points="' + starPoints(cx - r - 20, cy - 16, 12) + '"/>' +
       '<polygon points="' + starPoints(cx, cy - r - 26, 13) + '"/>' +
       '<polygon points="' + starPoints(cx + r + 20, cy - 16, 12) + '"/></g>';
  s += '</g>'; /* scale wrapper */
  return s;
}
</script>
<script>
"use strict";
/* ================= GAME STATE ================= */
function $(id){ return document.getElementById(id); }
var stageEl = $("stage"), victimG = $("victimG"), fxLayer = $("fxLayer"),
    popupsEl = $("popups"), comboEl = $("combo"), armEl = $("slapArm"),
    meterFill = $("meterFill"), meterPct = $("meterPct"), meterBox = $("meterBox");

var started = false, muted = false, lock = false;
var slaps = 0, level = 1, meter = 0;
var streak = 0, mult = 1, lastSlapAt = 0, lastSlapFxAt = 0;
var best = 0;
try { best = parseInt(localStorage.getItem("tq_best") || "0", 10) || 0; } catch (e) { best = 0; }

var curVictim = null, headEl = null, cheekEl = null, printEl = null, tearsEl = null, starsEl = null;
var cheekTimer = null;

var POP_WORDS = ["OUCH!", "AAH!", "CHATAK!", "LAG GAYI!", "THAPPAD!", "UI MAA!"];
var POP_COLORS = ["#e63950", "#ff6a00", "#d90429", "#ef476f", "#f77f00"];
var popIdx = 0;

/* ================= AUDIO: voice discipline ================= */
var voiceBusy = false, voiceAudio = null, pendingLevelLine = false;
var lastOuch = -1, lastTaunt = -1;

function playVoice(key){
  if (muted) return false;
  if (voiceBusy) return false;
  var a = new Audio(VOICES[key]);
  voiceAudio = a; voiceBusy = true;
  function done(){
    voiceBusy = false; voiceAudio = null;
    if (pendingLevelLine){ pendingLevelLine = false; playVoice("level"); }
  }
  a.onended = done; a.onerror = done;
  var p = a.play();
  if (p && p.catch) p.catch(function(){ done(); });
  return true;
}
function playOuch(){
  var i;
  do { i = Math.floor(Math.random() * 3); } while (i === lastOuch);
  lastOuch = i;
  return playVoice("ouch" + (i + 1));
}
function playTaunt(){
  var i;
  do { i = Math.floor(Math.random() * 2); } while (i === lastTaunt);
  lastTaunt = i;
  return playVoice("taunt" + (i + 1));
}
function scheduleLevelLine(){
  setTimeout(function(){
    if (voiceBusy) pendingLevelLine = true;
    else playVoice("level");
  }, 600);
}

/* ================= AUDIO: WebAudio slap SFX ================= */
var actx = null;
function initAudio(){
  if (!actx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  }
  if (actx && actx.state === "suspended") actx.resume();
}
function slapSound(){
  if (muted || !actx) return;
  var t = actx.currentTime;
  var dur = 0.09, len = Math.floor(actx.sampleRate * dur);
  var buf = actx.createBuffer(1, len, actx.sampleRate);
  var d = buf.getChannelData(0), i;
  for (i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.6);
  var src = actx.createBufferSource(); src.buffer = buf;
  var bp = actx.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 1700 + Math.random() * 700; bp.Q.value = 0.8;
  var g = actx.createGain();
  g.gain.setValueAtTime(0.85, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(actx.destination);
  src.start(t);
  var o = actx.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(165, t);
  o.frequency.exponentialRampToValueAtTime(58, t + 0.08);
  var og = actx.createGain();
  og.gain.setValueAtTime(0.5, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  o.connect(og); og.connect(actx.destination);
  o.start(t); o.stop(t + 0.1);
}

/* ================= RENDER / HUD ================= */
function renderVictim(walk){
  curVictim = VICTIMS[(level - 1) % VICTIMS.length];
  victimG.innerHTML = buildVictim(curVictim);
  headEl = victimG.querySelector(".vHead");
  cheekEl = $("cheekRed"); printEl = $("handPrint");
  tearsEl = $("tearsG"); starsEl = $("spinStars");
  victimG.classList.remove("walkin", "jump");
  if (walk){ void victimG.getBoundingClientRect(); victimG.classList.add("walkin"); }
}
function updateHUD(){
  $("slapCount").textContent = slaps;
  $("levelNum").textContent = level;
  $("bestNum").textContent = best;
  var pct = Math.round(meter);
  meterFill.style.width = pct + "%";
  meterFill.style.background = "hsl(" + Math.round(45 - meter * 0.45) + " 95% 55%)";
  meterPct.textContent = pct + "%";
  meterBox.classList.toggle("hot", meter >= 85);
  if (mult > 1){
    comboEl.textContent = (mult >= 3 ? "FEVER! COMBO x3!" : "COMBO x" + mult + "!");
    comboEl.classList.add("show");
    comboEl.classList.toggle("feverCombo", mult >= 3);
  } else {
    comboEl.classList.remove("show");
  }
  stageEl.classList.toggle("fever", mult >= 3);
}

/* ================= FX ================= */
var SVGNS = "http://www.w3.org/2000/svg";
function spawnBurst(){
  if (fxLayer.childNodes.length > 22) return;
  var v = curVictim, cx = VCX - v.headR + 14, cy = v.headCy + 16;
  var burst = document.createElementNS(SVGNS, "polygon");
  burst.setAttribute("points", starPoints(cx, cy, 52));
  burst.setAttribute("fill", "#ffd93c");
  burst.setAttribute("stroke", "#e07b00");
  burst.setAttribute("stroke-width", "3");
  fxLayer.appendChild(burst);
  if (burst.animate){
    burst.animate([
      { transform: "scale(.3) rotate(0deg)", opacity: 1 },
      { transform: "scale(1.15) rotate(14deg)", opacity: 1, offset: .55 },
      { transform: "scale(1.3) rotate(20deg)", opacity: 0 }
    ], { duration: 300, easing: "ease-out" }).onfinish = function(){ burst.remove(); };
  } else {
    setTimeout(function(){ burst.remove(); }, 300);
  }
  burst.style.transformOrigin = cx + "px " + cy + "px";
  /* spark particles */
  var n = 6, i;
  for (i = 0; i < n; i++){
    var c = document.createElementNS(SVGNS, "circle");
    var ang = Math.random() * Math.PI * 2, dist = 46 + Math.random() * 42;
    c.setAttribute("cx", cx); c.setAttribute("cy", cy);
    c.setAttribute("r", 3.5 + Math.random() * 3);
    c.setAttribute("fill", POP_COLORS[i % POP_COLORS.length]);
    fxLayer.appendChild(c);
    if (c.animate){
      c.animate([
        { transform: "translate(0px,0px)", opacity: 1 },
        { transform: "translate(" + (Math.cos(ang) * dist) + "px," + (Math.sin(ang) * dist - 14) + "px)", opacity: 0 }
      ], { duration: 380 + Math.random() * 140, easing: "ease-out" }).onfinish = (function(el){ return function(){ el.remove(); }; })(c);
    } else {
      setTimeout((function(el){ return function(){ el.remove(); }; })(c), 420);
    }
  }
}
function spawnPop(){
  if (popupsEl.childNodes.length > 4) popupsEl.removeChild(popupsEl.firstChild);
  var el = document.createElement("div");
  el.className = "pop";
  el.textContent = POP_WORDS[popIdx % POP_WORDS.length];
  popIdx++;
  el.style.left = (50 + Math.random() * 17) + "%";
  el.style.top = (24 + Math.random() * 15) + "%";
  el.style.color = POP_COLORS[Math.floor(Math.random() * POP_COLORS.length)];
  el.style.setProperty("--r", (Math.random() * 26 - 13) + "deg");
  el.style.fontSize = "clamp(26px," + (6 + Math.random() * 2.5) + "vmin,54px)";
  el.addEventListener("animationend", function(){ el.remove(); });
  popupsEl.appendChild(el);
}
function flashCheek(){
  if (!cheekEl) return;
  cheekEl.setAttribute("opacity", "0.8");
  printEl.setAttribute("opacity", "0.92");
  if (cheekTimer) clearTimeout(cheekTimer);
  cheekTimer = setTimeout(function(){
    cheekEl.setAttribute("opacity", "0");
    printEl.setAttribute("opacity", "0");
  }, 620);
}

/* ================= CORE: SLAP ================= */
function doSlap(){
  if (!started || lock) return;
  var now = performance.now();
  if (now - lastSlapFxAt < 90) return;
  lastSlapFxAt = now;

  /* combo streak */
  if (now - lastSlapAt < 800) streak++; else streak = 1;
  lastSlapAt = now;
  var prevMult = mult;
  mult = streak >= 10 ? 3 : (streak >= 5 ? 2 : 1);
  if (mult > prevMult && mult > 1){
    comboEl.textContent = (mult >= 3 ? "FEVER! COMBO x3!" : "COMBO x" + mult + "!");
  }

  slaps++;
  if (slaps > best){
    best = slaps;
    try { localStorage.setItem("tq_best", String(best)); } catch (e) {}
  }
  meter = Math.min(100, meter + 6 * mult);

  /* arm swing, effects at contact */
  armEl.classList.remove("swing");
  void armEl.getBoundingClientRect();
  armEl.classList.add("swing");
  setTimeout(function(){
    slapSound();
    if (headEl){
      headEl.classList.remove("shake");
      void headEl.getBoundingClientRect();
      headEl.classList.add("shake");
    }
    flashCheek();
    spawnBurst();
    spawnPop();
  }, 120);

  updateHUD();

  if (meter >= 100){ levelUp(); return; }
  if (slaps % 18 === 0) playTaunt();
  else if (slaps % 12 === 0) playOuch();
}

/* ================= LEVEL UP ================= */
function levelUp(){
  lock = true;
  playOuch();
  scheduleLevelLine();
  victimG.classList.remove("jump");
  void victimG.getBoundingClientRect();
  victimG.classList.add("jump");
  if (tearsEl) tearsEl.setAttribute("opacity", "1");
  if (starsEl){ starsEl.setAttribute("opacity", "1"); starsEl.classList.add("spinOn"); }
  streak = 0; mult = 1;

  setTimeout(function(){
    level++;
    meter = 0;
    renderVictim(true);
    updateHUD();
    var nv = VICTIMS[(level - 1) % VICTIMS.length];
    $("lvlBig").textContent = "LEVEL " + level + "!";
    $("lvlSub").textContent = "अब बारी: " + nv.name + " — " + nv.sub;
    var b = $("lvlBanner");
    b.classList.remove("show");
    void b.getBoundingClientRect();
    b.classList.add("show");
    setTimeout(function(){ b.classList.remove("show"); }, 1650);
  }, 950);

  setTimeout(function(){ lock = false; }, 1500);
}

/* ================= IDLE LOOP: drain + combo decay ================= */
setInterval(function(){
  if (!started || lock) return;
  var drainPerSec = Math.min(8, 2 + (level - 1) * 0.5);
  if (meter > 0){ meter = Math.max(0, meter - drainPerSec / 10); }
  if (streak > 0 && performance.now() - lastSlapAt >= 800){
    streak = 0; mult = 1;
  }
  updateHUD();
}, 100);

/* ================= INPUT ================= */
var lastPointerSlap = 0;
function slapFromPointer(){ lastPointerSlap = performance.now(); doSlap(); }
function slapFromClick(){ if (performance.now() - lastPointerSlap > 600) doSlap(); }
$("slapBtn").addEventListener("pointerdown", function(e){ e.preventDefault(); slapFromPointer(); this.blur(); });
$("slapBtn").addEventListener("click", function(){ slapFromClick(); this.blur(); });
$("victimHit").addEventListener("pointerdown", function(e){ e.preventDefault(); slapFromPointer(); });
$("victimHit").addEventListener("click", function(){ slapFromClick(); });
document.addEventListener("keydown", function(e){
  if (e.code === "Space" || e.key === " "){
    e.preventDefault();
    if (!e.repeat) doSlap();
  }
});
$("soundBtn").addEventListener("click", function(){
  muted = !muted;
  if (muted && voiceAudio){ try { voiceAudio.pause(); } catch (e) {} voiceBusy = false; voiceAudio = null; pendingLevelLine = false; }
  this.innerHTML = muted ? "साउंड<br>OFF" : "साउंड<br>ON";
  this.blur();
});
$("resetBtn").addEventListener("click", function(){
  slaps = 0; level = 1; meter = 0; streak = 0; mult = 1; lock = false;
  pendingLevelLine = false;
  renderVictim(false);
  updateHUD();
  this.blur();
});
$("startBtn").addEventListener("click", function(){
  started = true;
  initAudio();
  $("startOv").classList.add("hidden");
  playVoice("start");
  this.blur();
});

/* init */
renderVictim(false);
updateHUD();
</script>
</body>
</html>
