<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>AttendPro LCD Edition (Public)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      * { box-sizing: border-box; }
      :root{
        --bg:#06080b; --bg2:#0a0e13; --panel:rgba(148,197,255,.055); --panel2:rgba(148,197,255,.09);
        --line:rgba(125,211,252,.16); --line2:rgba(125,211,252,.28);
        --ink:#dbe7f3; --muted:#8fa3b8; --faint:#5d7186;
        --cyan:#38e1ff; --green:#2effa0; --red:#ff5468; --amber:#ffb02e; --blue:#4db2ff; --purple:#c084fc;
        --lcd:#7dfcd4;
      }
      html{ -webkit-text-size-adjust:100%; }
      body{
        margin:0; color:var(--ink); font-family:"Rajdhani",system-ui,sans-serif; font-size:17px; line-height:1.45;
        background:
          radial-gradient(900px 480px at 85% -10%, rgba(56,225,255,.07), transparent 60%),
          radial-gradient(700px 420px at -10% 110%, rgba(46,255,160,.05), transparent 60%),
          linear-gradient(180deg,var(--bg2),var(--bg));
        min-height:100vh;
      }
      .lcd{ font-family:"Orbitron",monospace; letter-spacing:.04em; }
      button{ font-family:inherit; cursor:pointer; }
      input,select,textarea{ font-family:inherit; color:var(--ink); background:rgba(0,0,0,.42); border:1px solid var(--line); border-radius:9px; padding:.45rem .6rem; font-size:1rem; }
      input:focus,select:focus{ outline:2px solid rgba(56,225,255,.45); outline-offset:1px; border-color:var(--line2); }
      label{ font-size:.82rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:.3rem; }
      ::placeholder{ color:var(--faint); }

      /* ---------- top bar ---------- */
      .topbar{
        position:sticky; top:0; z-index:40; display:flex; flex-wrap:wrap; gap:.6rem 1rem; align-items:center; justify-content:space-between;
        padding:.65rem clamp(.7rem,3vw,1.4rem); background:rgba(6,9,13,.88); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
      }
      .brand{ font-family:"Orbitron",monospace; font-weight:800; font-size:1.12rem; letter-spacing:.12em; color:#eaf6ff; }
      .brand b{ color:var(--cyan); font-weight:800; }
      .brand small{ display:block; font-family:"Rajdhani",sans-serif; font-size:.66rem; letter-spacing:.42em; color:var(--muted); font-weight:700; }
      .clockbox{ text-align:center; }
      .clockbox .lcd{ font-size:clamp(1.35rem,4.5vw,1.9rem); font-weight:700; color:var(--lcd); text-shadow:0 0 14px rgba(46,255,190,.28); line-height:1; }
      .clockbox .dateline{ font-size:.8rem; letter-spacing:.18em; color:var(--muted); font-weight:600; text-transform:uppercase; margin-top:.2rem; }
      .top-actions{ display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
      .seg{ display:flex; background:rgba(0,0,0,.45); border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px; }
      .seg button{ border:0; background:transparent; color:var(--muted); font-weight:700; letter-spacing:.06em; padding:.35rem .8rem; border-radius:7px; font-size:.92rem; }
      .seg button.on{ background:rgba(56,225,255,.16); color:var(--cyan); box-shadow:inset 0 0 0 1px rgba(56,225,255,.35); }
      .rolechip{ border:1px solid var(--line2); background:rgba(56,225,255,.08); color:var(--cyan); border-radius:999px; padding:.35rem .8rem; font-weight:700; letter-spacing:.08em; font-size:.85rem; }

      /* ---------- tabs ---------- */
      .tabs{ display:flex; gap:.35rem; flex-wrap:wrap; padding:.5rem clamp(.7rem,3vw,1.4rem); background:rgba(6,9,13,.85); border-bottom:1px solid var(--line); }
      .tabs button{ border:1px solid transparent; background:transparent; color:var(--muted); font-weight:700; letter-spacing:.07em; padding:.45rem .85rem; border-radius:9px; font-size:.95rem; text-transform:uppercase; }
      .tabs button.on{ color:#eaf6ff; background:var(--panel2); border-color:var(--line); }
      .tabs button.on .dot{ color:var(--green); }

      main{ max-width:1180px; margin:0 auto; padding:1.1rem clamp(.7rem,3vw,1.4rem) 3rem; }
      h2.sec{ font-family:"Orbitron",monospace; font-size:1rem; letter-spacing:.22em; color:#eaf6ff; margin:1.4rem 0 .7rem; text-transform:uppercase; }
      h2.sec:first-child{ margin-top:.2rem; }
      .muted{ color:var(--muted); } .small{ font-size:.88rem; }

      /* ---------- panels & cards ---------- */
      .panel{ background:linear-gradient(165deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:14px; padding:1rem 1.1rem; backdrop-filter:blur(8px); }
      .hero{
        border-radius:16px; padding:1.3rem 1.2rem 1.15rem; text-align:center; position:relative; overflow:hidden;
        background:linear-gradient(170deg, rgba(46,255,190,.10), rgba(10,16,22,.65) 55%), #0a0f14;
        border:1px solid rgba(46,255,190,.30);
        box-shadow:inset 0 0 42px rgba(46,255,190,.06);
      }
      .hero .cap{ font-size:.8rem; letter-spacing:.34em; font-weight:700; color:var(--muted); text-transform:uppercase; }
      .hero .big{ font-family:"Orbitron",monospace; font-weight:800; font-size:clamp(2.6rem,9vw,4.4rem); color:var(--lcd); text-shadow:0 0 22px rgba(46,255,190,.35); line-height:1.08; margin:.25rem 0 .1rem; }
      .hero .big small{ font-size:.38em; color:var(--cyan); letter-spacing:.2em; }
      .hero .sub{ color:var(--muted); font-weight:600; letter-spacing:.06em; }
      .grid{ display:grid; gap:.7rem; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); margin-top:.7rem; }
      .stat{ border-radius:12px; padding:.85rem .9rem .75rem; background:linear-gradient(165deg,var(--panel2),var(--panel)); border:1px solid var(--line); }
      .stat .cap{ font-size:.72rem; letter-spacing:.22em; font-weight:700; color:var(--muted); text-transform:uppercase; }
      .stat .val{ font-family:"Orbitron",monospace; font-weight:700; font-size:1.55rem; margin-top:.3rem; color:#eaf6ff; line-height:1.1; }
      .stat .val small{ font-size:.55em; color:var(--muted); letter-spacing:.12em; }
      .stat .hint{ font-size:.85rem; color:var(--faint); font-weight:600; }
      .c-green{ color:var(--green)!important; } .c-red{ color:var(--red)!important; } .c-cyan{ color:var(--cyan)!important; }
      .c-amber{ color:var(--amber)!important; } .c-purple{ color:var(--purple)!important; } .c-blue{ color:var(--blue)!important; }

      /* ---------- buttons ---------- */
      .btn{ border:1px solid var(--line2); background:rgba(56,225,255,.10); color:#dff4ff; font-weight:700; letter-spacing:.05em; border-radius:9px; padding:.5rem 1rem; font-size:.98rem; }
      .btn:hover{ background:rgba(56,225,255,.18); }
      .btn.ghost{ background:transparent; color:var(--muted); border-color:var(--line); }
      .btn.green{ background:rgba(46,255,160,.12); border-color:rgba(46,255,160,.4); color:#c9ffe6; }
      .btn.red{ background:rgba(255,84,104,.10); border-color:rgba(255,84,104,.4); color:#ffd7dc; }
      .btn.sm{ padding:.32rem .7rem; font-size:.9rem; min-height:2rem; }
      .btn:disabled{ opacity:.45; cursor:not-allowed; }
      .rowflex{ display:flex; gap:.55rem; flex-wrap:wrap; align-items:center; }
      .grow{ flex:1 1 auto; }

      /* ---------- attendance rows ---------- */
      .datebar{ display:flex; gap:.6rem; flex-wrap:wrap; align-items:flex-end; margin-bottom:.8rem; }
      .arow{ border:1px solid var(--line); border-radius:12px; background:linear-gradient(165deg,var(--panel2),var(--panel)); padding:.8rem .9rem; margin-bottom:.6rem; }
      .arow .head{ display:flex; gap:.7rem; align-items:center; flex-wrap:wrap; }
      .arow .nm{ font-weight:700; font-size:1.08rem; }
      .arow .meta{ color:var(--muted); font-size:.88rem; font-weight:600; }
      .arow .hrs{ margin-left:auto; text-align:right; }
      .arow .hrs .lcd{ font-size:1.3rem; font-weight:700; color:var(--lcd); }
      .arow .hrs .ot{ font-size:.82rem; color:var(--amber); font-weight:700; letter-spacing:.05em; }
      .ticks{ display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.6rem; }
      .tick{ border-radius:9px; border:1px solid var(--line); background:rgba(0,0,0,.35); color:var(--muted); font-weight:700; padding:.42rem .7rem; font-size:.95rem; letter-spacing:.03em; }
      .tick[data-s="P"].on{ background:rgba(46,255,160,.16); border-color:var(--green); color:var(--green); }
      .tick[data-s="A"].on{ background:rgba(255,84,104,.16); border-color:var(--red); color:var(--red); }
      .tick[data-s="H"].on{ background:rgba(255,176,46,.16); border-color:var(--amber); color:var(--amber); }
      .tick[data-s="WO"].on{ background:rgba(77,178,255,.16); border-color:var(--blue); color:var(--blue); }
      .tick[data-s="L"].on{ background:rgba(192,132,252,.16); border-color:var(--purple); color:var(--purple); }
      .editor{ margin-top:.8rem; border-top:1px dashed var(--line); padding-top:.8rem; }
      .fgrid{ display:grid; gap:.7rem; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
      .calcbox{ margin-top:.7rem; border:1px solid rgba(46,255,190,.25); background:rgba(46,255,190,.05); border-radius:10px; padding:.6rem .8rem; font-weight:600; }
      .calcbox .lcd{ color:var(--lcd); font-size:1.15rem; }

      /* ---------- employees ---------- */
      .ecard{ display:flex; gap:.8rem; align-items:center; flex-wrap:wrap; border:1px solid var(--line); border-radius:12px; background:linear-gradient(165deg,var(--panel2),var(--panel)); padding:.75rem .9rem; margin-bottom:.55rem; }
      .avatar{ width:44px; height:44px; border-radius:10px; display:grid; place-items:center; font-family:"Orbitron",monospace; font-weight:700; color:#04121a; background:linear-gradient(140deg,var(--cyan),var(--green)); flex:0 0 auto; }

      /* ---------- calendar ---------- */
      .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:.4rem; }
      .cal .dow{ text-align:center; font-size:.75rem; letter-spacing:.2em; color:var(--faint); font-weight:700; padding:.2rem 0; }
      .cal .cell{ min-height:74px; border:1px solid var(--line); border-radius:10px; background:rgba(0,0,0,.3); padding:.4rem .45rem; cursor:pointer; text-align:left; color:var(--ink); width:100%; }
      .cal .cell:hover{ border-color:var(--line2); }
      .cal .cell.off{ opacity:.32; cursor:default; }
      .cal .cell.today{ border-color:var(--cyan); box-shadow:inset 0 0 0 1px rgba(56,225,255,.4); }
      .cal .cell .d{ font-family:"Orbitron",monospace; font-weight:700; font-size:.95rem; }
      .cal .cell .h{ font-size:.78rem; color:var(--lcd); font-weight:700; }
      .dots{ display:flex; gap:3px; flex-wrap:wrap; margin-top:3px; }
      .dots i{ width:9px; height:9px; border-radius:3px; display:block; }
      .legend{ display:flex; gap:1rem; flex-wrap:wrap; margin-top:.7rem; font-size:.88rem; font-weight:600; color:var(--muted); }
      .legend i{ width:11px; height:11px; border-radius:3px; display:inline-block; margin-right:.35rem; vertical-align:-1px; }

      /* ---------- tables ---------- */
      .tblwrap{ border:1px solid var(--line); border-radius:12px; overflow:hidden; background:rgba(0,0,0,.25); }
      table{ width:100%; border-collapse:collapse; font-size:.98rem; }
      th{ text-align:left; font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); background:rgba(56,225,255,.06); padding:.6rem .7rem; border-bottom:1px solid var(--line); }
      td{ padding:.55rem .7rem; border-bottom:1px solid rgba(125,211,252,.07); font-weight:600; }
      tr:last-child td{ border-bottom:0; }
      td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; }
      tr.total td{ background:rgba(46,255,190,.06); font-weight:700; color:#eafff5; }
      @media (max-width:820px){
        .tblwrap{ border:0; background:transparent; overflow:visible; }
        table, tbody, tr, td{ display:block; width:100%; }
        thead{ display:none; }
        tr{ border:1px solid var(--line); border-radius:12px; margin-bottom:.6rem; background:linear-gradient(165deg,var(--panel2),var(--panel)); padding:.5rem .4rem; }
        td{ border:0; display:flex; justify-content:space-between; gap:1rem; padding:.32rem .6rem; text-align:right; }
        td::before{ content:attr(data-l); color:var(--muted); font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; font-weight:700; text-align:left; }
        td:first-child{ font-size:1.08rem; }
        td:first-child::before{ content:""; }
      }

      /* ---------- modal / lock / toast ---------- */
      .overlay{ position:fixed; inset:0; z-index:80; background:rgba(2,4,7,.78); backdrop-filter:blur(6px); display:grid; place-items:center; padding:1rem; }
      .sheet{ width:min(430px,100%); border-radius:16px; border:1px solid var(--line2); background:linear-gradient(170deg,#101820,#0a0f14); padding:1.4rem 1.3rem; box-shadow:0 24px 60px rgba(0,0,0,.6); }
      .sheet h3{ font-family:"Orbitron",monospace; letter-spacing:.14em; margin:.1rem 0 .6rem; font-size:1.05rem; }
      #toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); z-index:99; background:#0d1620; border:1px solid rgba(46,255,190,.45); color:#d9ffee; font-weight:700; padding:.6rem 1.1rem; border-radius:10px; opacity:0; pointer-events:none; transition:.25s; max-width:92vw; text-align:center; }
      #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
      .empty{ border:1px dashed var(--line2); border-radius:12px; padding:1.4rem 1rem; text-align:center; color:var(--muted); font-weight:600; }
      .switchrow{ display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:.7rem 0; border-bottom:1px solid rgba(125,211,252,.08); }
      .switchrow:last-child{ border-bottom:0; }
      .tgl{ position:relative; width:52px; height:30px; flex:0 0 auto; }
      .tgl input{ position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
      .tgl span{ position:absolute; inset:0; border-radius:999px; background:rgba(255,255,255,.12); border:1px solid var(--line); transition:.2s; pointer-events:none; }
      .tgl span::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#9fb4c8; transition:.2s; }
      .tgl input:checked + span{ background:rgba(46,255,160,.25); border-color:var(--green); }
      .tgl input:checked + span::after{ left:25px; background:var(--green); }

      /* ---------- print sheet ---------- */
      #printSheet{ display:none; }
      body.printing main, body.printing .topbar, body.printing .tabs{ display:none; }
      body.printing #printSheet{ display:block; background:#fff; color:#111; padding:24px; font-family:Arial,sans-serif; }
      #printSheet table{ font-size:12px; } #printSheet th{ background:#eee; color:#111; } #printSheet td{ border-bottom:1px solid #ccc; }
      @media print{
        body{ background:#fff; }
        .topbar,.tabs,main,#toast{ display:none!important; }
        #printSheet{ display:block!important; }
      }
      @media (prefers-reduced-motion: reduce){ *{ transition:none!important; } }
    </style>
  </head>
  <body>

    <div id="lockRoot"></div>

    <header class="topbar">
      <div class="brand">ATTEND<b>PRO</b><small>LCD EDITION</small></div>
      <div class="clockbox">
        <div class="lcd" id="clock">00:00:00</div>
        <div class="dateline" id="dateline">—</div>
      </div>
      <div class="top-actions">
        <div class="seg" role="group" aria-label="Mode">
          <button id="modeCompany" type="button">COMPANY</button>
          <button id="modePersonal" type="button">PERSONAL</button>
        </div>
        <button class="rolechip" id="roleBtn" type="button">ADMIN</button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="dash" type="button">Dashboard</button>
      <button data-tab="mark" type="button">Attendance</button>
      <button data-tab="emps" type="button" id="tabEmps">Employees</button>
      <button data-tab="cal" type="button">Calendar</button>
      <button data-tab="rep" type="button">Reports</button>
      <button data-tab="set" type="button">Settings</button>
    </nav>

    <main id="view"></main>
    <section id="printSheet"></section>
    <div id="modalRoot"></div>
    <div id="toast" role="status"></div>
    <input type="file" id="restoreFile" accept="application/json,.json" hidden />

    <script>
    "use strict";
    /* ================= storage ================= */
    var LS_KEY = "attendpro_lcd_public_v1";
    function defaultState(){
      return {
        settings: {
          mode: "company",            // company | personal
          role: "admin",              // admin | employee
          pin: "",                    // optional admin PIN
          myEmpId: "",                // employee-role: own employee code
          stdMin: 480,                // standard day = 8h, stored in minutes
          otMultiplier: 1,            // overtime pay multiplier
          woPaid: true,               // weekly off counts as paid day
          leavePaid: false,           // leave counts as paid day
          personalName: "My Attendance",
          personalSalary: 0
        },
        employees: [],                // {code,name,dept,desig,joining,salary}
        att: { company: {}, personal: {} } // company: {dateKey:{code:rec}}  personal: {dateKey:rec}
      };
    }
    var S;
    try { S = JSON.parse(localStorage.getItem(LS_KEY)) || defaultState(); }
    catch(e){ S = defaultState(); }
    if(!S.settings || !S.att) S = defaultState();
    function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){ toast("Storage full — backup your data from Settings."); } }

    /* ================= ui session state ================= */
    var UI = {
      tab: "dash",
      markDate: todayKey(),
      calY: null, calM: null,
      repY: null, repM: null,
      repDate: todayKey(),
      search: "",
      openEd: null,        // employee code (or "me") whose hours editor is open
      showEmpForm: false,
      editEmp: null,       // code being edited
      unlocked: false      // admin PIN entered this session
    };
    var nowD = new Date();
    UI.calY = nowD.getFullYear(); UI.calM = nowD.getMonth();
    UI.repY = nowD.getFullYear(); UI.repM = nowD.getMonth();

    /* ================= date / time helpers ================= */
    function pad(n){ return (n<10?"0":"")+n; }
    function keyOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
    function todayKey(){ return keyOf(new Date()); }
    function parseKey(k){ var p=k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
    function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
    function monthName(m){ return ["January","February","March","April","May","June","July","August","September","October","November","December"][m]; }
    function prettyDate(k){ var d=parseKey(k); return d.getDate()+" "+monthName(d.getMonth()).slice(0,3)+" "+d.getFullYear(); }
    function t2m(t){ if(!t) return null; var p=t.split(":"); return (+p[0])*60 + (+p[1]); }
    /* minutes -> direct decimal hours string, e.g. 690 -> "11.5", 480 -> "8" */
    function dec(mins){
      var v = Math.round((mins/60)*100)/100;
      var s = (Math.round(v*100)/100).toString();
      return s;
    }
    function hrs(mins){ return dec(mins)+" HRS"; }
    function parseHours(str){
      if(str===null||str===undefined) return null;
      var v = parseFloat(String(str).replace(",", "."));
      if(isNaN(v) || v<0 || v>24) return null;
      return Math.round(v*60);
    }

    /* ================= attendance engine (all math in minutes) ================= */
    var STATUSES = [
      {k:"P",  sym:"✓",  label:"Present",   cls:"c-green"},
      {k:"A",  sym:"✗",  label:"Absent",    cls:"c-red"},
      {k:"H",  sym:"½",  label:"Half Day",  cls:"c-amber"},
      {k:"WO", sym:"WO", label:"Weekly Off",cls:"c-blue"},
      {k:"L",  sym:"L",  label:"Leave",     cls:"c-purple"}
    ];
    var SCOLOR = { P:"#2effa0", A:"#ff5468", H:"#ffb02e", WO:"#4db2ff", L:"#c084fc" };

    function getRec(scope, dk, code){
      if(scope==="personal") return S.att.personal[dk] || null;
      var day = S.att.company[dk]; return day ? (day[code]||null) : null;
    }
    function setRec(scope, dk, code, rec){
      if(scope==="personal"){ if(rec) S.att.personal[dk]=rec; else delete S.att.personal[dk]; }
      else {
        if(!S.att.company[dk]) S.att.company[dk]={};
        if(rec) S.att.company[dk][code]=rec; else delete S.att.company[dk][code];
        if(!rec && Object.keys(S.att.company[dk]).length===0) delete S.att.company[dk];
      }
      save();
    }
    /* worked / overtime / absent minutes for one record */
    function recCalc(rec){
      var std = S.settings.stdMin, work=0, ot=0, absent=0;
      if(!rec) return {work:0, ot:0, absent:0};
      if(rec.status==="P" || rec.status==="H"){
        if(rec.manualMin!==null && rec.manualMin!==undefined && rec.manualMin!=="") work = +rec.manualMin;
        else if(rec.inT && rec.outT){
          var a=t2m(rec.inT), b=t2m(rec.outT); if(b<a) b+=1440; // overnight shift
          work = Math.max(0, b-a-(+rec.breakMin||0));
        } else work = rec.status==="P" ? std : Math.round(std/2);
        ot = Math.max(0, work-std);
      }
      if(rec.status==="A") absent = std;
      return {work:work, ot:ot, absent:absent};
    }
    /* aggregate one employee (or personal) over a month */
    function monthStats(scope, code, y, m){
      var dim = daysInMonth(y,m), st = {P:0,A:0,H:0,WO:0,L:0, work:0, ot:0, absent:0, marked:0};
      for(var d=1; d<=dim; d++){
        var dk = y+"-"+pad(m+1)+"-"+pad(d);
        var rec = getRec(scope, dk, code);
        if(rec && rec.status){ st[rec.status]++; st.marked++; var c=recCalc(rec); st.work+=c.work; st.ot+=c.ot; st.absent+=c.absent; }
      }
      var denom = st.P + st.A + st.H + st.L;
      st.pct = denom>0 ? Math.round(((st.P + st.H*0.5)/denom)*1000)/10 : 0;
      return st;
    }
    function rangeStats(scope, code, fromKey, toKey){
      var st = {work:0, ot:0, absent:0}, d = parseKey(fromKey), end = parseKey(toKey);
      while(d<=end){ var c = recCalc(getRec(scope, keyOf(d), code)); st.work+=c.work; st.ot+=c.ot; st.absent+=c.absent; d.setDate(d.getDate()+1); }
      return st;
    }
    function weekStats(scope, code){
      var d = new Date(); var dow = (d.getDay()+6)%7; // Monday start
      var mon = new Date(d); mon.setDate(d.getDate()-dow);
      var sun = new Date(mon); sun.setDate(mon.getDate()+6);
      return rangeStats(scope, code, keyOf(mon), keyOf(sun));
    }
    function yearStats(scope, code, y){
      var t = {work:0, ot:0, absent:0};
      for(var m=0;m<12;m++){ var s=monthStats(scope,code,y,m); t.work+=s.work; t.ot+=s.ot; t.absent+=s.absent; }
      return t;
    }
    function salaryEstimate(monthlySalary, st, y, m){
      var dim = daysInMonth(y,m), set = S.settings;
      var paidDays = st.P + st.H*0.5 + (set.woPaid?st.WO:0) + (set.leavePaid?st.L:0);
      var unpaidDays = (set.leavePaid?0:st.L) + st.A + st.H*0.5;
      var perDay = dim>0 ? monthlySalary/dim : 0;
      var base = perDay * paidDays;
      var hourly = set.stdMin>0 ? monthlySalary/(dim*(set.stdMin/60)) : 0;
      var otPay = (st.ot/60) * hourly * (+set.otMultiplier||1);
      return { paidDays: Math.round(paidDays*100)/100, unpaidDays: Math.round(unpaidDays*100)/100,
               otPay: Math.round(otPay), est: Math.round(base+otPay) };
    }

    function esc(s){ return String(s===null||s===undefined?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

    function statCard(cap, valHtml, hint, cls){

        '<button type="button" data-act="mode" data-m="manual" data-scope="'+scope+'" data-date="'+dk+'" data-code="'+esc(code)+'" class="'+(mode==="manual"?"on":"")+'">MANUAL (Decimal)</button></div></div>';
      if(mode==="auto"){
        h += '<div class="fgrid">'+
          '<div><label>In Time</label><input type="time" style="width:100%" data-f="inT" value="'+esc(rec.inT||"")+'"></div>'+
          '<div><label>Out Time</label><input type="time" style="width:100%" data-f="outT" value="'+esc(rec.outT||"")+'"></div>'+
          '<div><label>Break (minutes)</label><input type="number" min="0" max="720" step="5" style="width:100%" data-f="breakMin" value="'+(rec.breakMin===undefined?60:rec.breakMin)+'"></div>'+
        '</div><p class="muted small" style="margin:.5rem 0 0">Working Hours = Out − In − Break. Example: 09:00 → 18:00 with 60 min break = 8 HRS.</p>';
      } else {
        h += '<div class="fgrid"><div><label>Hours (decimal — e.g. 11.5)</label>'+
          '<input type="text" inputmode="decimal" placeholder="11.5" style="width:100%" data-f="manualHrs" value="'+(rec.manualMin!==null&&rec.manualMin!==undefined?dec(+rec.manualMin):"")+'"></div></div>'+
          '<p class="muted small" style="margin:.5rem 0 0">Type hours directly: 5, 7.5, 8, 11.5 — shown exactly as typed, in decimal.</p>';
      }
      h += '<div class="calcbox">Worked <span class="lcd">'+hrs(c.work)+'</span> &nbsp;·&nbsp; Overtime <span class="lcd" style="color:var(--amber)">'+hrs(c.ot)+'</span>'+

    /* ================= EXPORT ================= */
    function download(name, text, type){
      var blob=new Blob([text], {type:type||"text/plain;charset=utf-8"});
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
    }
    function csvCell(v){ v=String(v===null||v===undefined?"":v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
    function toCSV(rows){ return rows.map(function(r){ return r.map(csvCell).join(","); }).join("\n"); }
    function exportMonthly(){
      var y=UI.repY, m=UI.repM, rows=[["Employee Name","Employee ID","Present Days","Absent Days","Half Days","Leave Days","Weekly Off","Total Day Hours (today)","Total Monthly Hours","Total Overtime","Total Absent Hours","Attendance %"]];
      if(S.settings.mode==="personal"){
        var ps=monthStats("personal", null, y, m);
        rows.push([S.settings.personalName,"ME",ps.P,ps.A,ps.H,ps.L,ps.WO,dec(recCalc(getRec("personal",todayKey(),null)).work),dec(ps.work),dec(ps.ot),dec(ps.absent),ps.pct]);
      } else reportRows(y,m).forEach(function(r){
        rows.push([r.e.name, r.e.code, r.s.P, r.s.A, r.s.H, r.s.L, r.s.WO, dec(recCalc(getRec("company",todayKey(),r.e.code)).work), dec(r.s.work), dec(r.s.ot), dec(r.s.absent), r.s.pct]);
      });
      download("attendpro-monthly-"+y+"-"+pad(m+1)+".csv", toCSV(rows), "text/csv;charset=utf-8");
      toast("Monthly report CSV downloaded.");
    }
    function exportDaily(){
      var dk=UI.repDate, rows=[["Date","Employee Name","Employee ID","Status","In Time","Out Time","Break (min)","Day Hours","Overtime Hours","Absent Hours"]];
      if(S.settings.mode==="personal"){
        var rec=getRec("personal", dk, null); if(rec){ var c=recCalc(rec); rows.push([dk, S.settings.personalName, "ME", statusLabel(rec.status), rec.inT||"", rec.outT||"", rec.breakMin||0, dec(c.work), dec(c.ot), dec(c.absent)]); }
      } else S.employees.forEach(function(e){
        var rec=getRec("company", dk, e.code); if(rec){ var c=recCalc(rec); rows.push([dk, e.name, e.code, statusLabel(rec.status), rec.inT||"", rec.outT||"", rec.breakMin||0, dec(c.work), dec(c.ot), dec(c.absent)]); }
      });
      if(rows.length===1){ toast("No records on "+prettyDate(dk)+"."); return; }
      download("attendpro-daily-"+dk+".csv", toCSV(rows), "text/csv;charset=utf-8");
      toast("Daily report CSV downloaded.");
    }
    function exportHours(){
      var y=UI.repY, rows=[["Employee Name","Employee ID","Month","Hours"]];
      var codes = S.settings.mode==="personal" ? [null] : S.employees.map(function(e){ return e.code; });
      codes.forEach(function(code){
        var nm = code? (empByCode(code)||{}).name : S.settings.personalName;
        for(var m=0;m<12;m++){ var s=monthStats(S.settings.mode, code, y, m); if(s.marked) rows.push([nm, code||"ME", monthName(m)+" "+y, dec(s.work)]); }
      });
      download("attendpro-employee-hours-"+y+".csv", toCSV(rows), "text/csv;charset=utf-8");
      toast("Employee hours CSV downloaded.");
    }
    function exportOT(){
      var y=UI.repY, m=UI.repM, dim=daysInMonth(y,m), rows=[["Date","Employee Name","Employee ID","Worked Hours","Overtime Hours"]];
      var codes = S.settings.mode==="personal" ? [null] : S.employees.map(function(e){ return e.code; });
      codes.forEach(function(code){
        var nm = code? (empByCode(code)||{}).name : S.settings.personalName;
        for(var d=1; d<=dim; d++){ var dk=y+"-"+pad(m+1)+"-"+pad(d); var c=recCalc(getRec(S.settings.mode, dk, code)); if(c.ot>0) rows.push([dk, nm, code||"ME", dec(c.work), dec(c.ot)]); }
      });
      if(rows.length===1){ toast("No overtime in "+monthName(m)+" "+y+"."); return; }
      download("attendpro-overtime-"+y+"-"+pad(m+1)+".csv", toCSV(rows), "text/csv;charset=utf-8");
      toast("Overtime report CSV downloaded.");
    }

    function blankRec(){ return { status:"", mode:"auto", inT:"", outT:"", breakMin:60, manualMin:null }; }
    function collectEditor(wrap, rec){
      rec = rec || blankRec();
      var f=function(n){ return wrap.querySelector('[data-f="'+n+'"]'); };
      if(rec.mode==="manual"){
        var el=f("manualHrs"); if(el){ var mins=parseHours(el.value); rec.manualMin = (mins===null ? null : mins); }
      } else {
        var i=f("inT"), o=f("outT"), b=f("breakMin");
        if(i) rec.inT=i.value; if(o) rec.outT=o.value; if(b) rec.breakMin=Math.max(0, +b.value||0);
        rec.manualMin=null;
      }
      return rec;
    }
    document.getElementById("view").addEventListener("click", function(e){
      var el=e.target.closest("[data-act]"); if(!el) return;
      var act=el.getAttribute("data-act"), scope=el.getAttribute("data-scope"), dk=el.getAttribute("data-date"), code=el.getAttribute("data-code");
      var realCode = scope==="personal" ? null : code;

      if(act==="tick"){
        if(el.disabled) return;
        var rec=getRec(scope, dk, realCode) || blankRec();
        if(rec.status===el.getAttribute("data-s")){ setRec(scope, dk, realCode, null); toast("Cleared — "+prettyDate(dk)); }
        else { rec.status=el.getAttribute("data-s"); if(rec.manualMin===undefined) rec.manualMin=null; setRec(scope, dk, realCode, rec); toast(statusLabel(rec.status)+" — "+prettyDate(dk)); }
        render(); return;
      }
      if(act==="openEd"){ UI.openEd = (UI.openEd===code ? null : code); render(); return; }
      if(act==="closeEd"){ UI.openEd=null; render(); return; }
      if(act==="mode"){
        var wrap=el.closest(".edwrap"); var r2=getRec(scope, dk, realCode) || blankRec();
        if(wrap) r2=collectEditor(wrap, r2);
        r2.mode=el.getAttribute("data-m"); if(!r2.status) r2.status="P";
        setRec(scope, dk, realCode, r2); render(); return;
      }
      if(act==="saveEd"){
        var wrap2=el.closest(".edwrap"); var r3=getRec(scope, dk, realCode) || blankRec();
        if(wrap2) r3=collectEditor(wrap2, r3);
        if(!r3.status) r3.status="P";
        setRec(scope, dk, realCode, r3);
        var cc=recCalc(r3); UI.openEd=null; toast("Saved — "+hrs(cc.work)+(cc.ot?" · OT "+hrs(cc.ot):"")); render(); return;
      }
      if(act==="clearRec"){ setRec(scope, dk, realCode, null); UI.openEd=null; toast("Day cleared."); render(); return; }
      if(act==="checkin" || act==="checkout"){
        var d=new Date(), t=pad(d.getHours())+":"+pad(d.getMinutes());
        var r4=getRec("personal", todayKey(), null) || blankRec();
        if(act==="checkin"){ r4.inT=t; if(!r4.status) r4.status="P"; r4.mode="auto"; }
        else { r4.outT=t; if(!r4.status) r4.status="P"; r4.mode="auto"; }
        setRec("personal", todayKey(), null, r4); toast((act==="checkin"?"Checked in at ":"Checked out at ")+t); render(); return;
      }
      if(act==="calDay"){ UI.markDate=dk; UI.tab="mark"; UI.openEd=null; render(); window.scrollTo(0,0); return; }
      if(act==="editEmp"){ UI.editEmp=code; UI.showEmpForm=false; render(); window.scrollTo(0,0); return; }
      if(act==="delEmp"){
        var emp=empByCode(code); if(!emp) return;
        openModal('<h3>DELETE EMPLOYEE</h3><p class="muted">Delete <b style="color:var(--ink)">'+esc(emp.name)+'</b> ('+esc(emp.code)+') and all their attendance records? This cannot be undone.</p>'+
          '<div class="rowflex" style="margin-top:1rem"><button type="button" class="btn red grow" id="delYes">Yes, Delete</button><button type="button" class="btn ghost" id="delNo">Cancel</button></div>');
        document.getElementById("delNo").addEventListener("click", closeModal);
        document.getElementById("delYes").addEventListener("click", function(){
          S.employees=S.employees.filter(function(x){ return x.code!==code; });
          Object.keys(S.att.company).forEach(function(k){ delete S.att.company[k][code]; });
          if(S.settings.myEmpId===code) S.settings.myEmpId="";
          save(); closeModal(); toast("Employee deleted."); render();
        });
        return;
      }
    });
    document.getElementById("view").addEventListener("change", function(e){
      var id=e.target.id;
      if(id==="markDate"){ UI.markDate=e.target.value||todayKey(); UI.openEd=null; var p=parseKey(UI.markDate); UI.repY=p.getFullYear(); UI.repM=p.getMonth(); render(); }
      if(id==="repMonth"){ UI.repM=+e.target.value; render(); }
      if(id==="repYear"){ UI.repY=+e.target.value; render(); }
      if(id==="repDate"){ UI.repDate=e.target.value||todayKey(); }
    });
    document.getElementById("view").addEventListener("input", function(e){
      if(e.target.id==="empSearch"){ UI.search=e.target.value; var pos=e.target.selectionStart; render(); var s=document.getElementById("empSearch"); if(s){ s.focus(); try{ s.setSelectionRange(pos,pos); }catch(err){} } }
    });
    document.getElementById("view").addEventListener("click", function(e){
      var id=e.target.id;
      if(id==="calPrev"){ UI.calM--; if(UI.calM<0){ UI.calM=11; UI.calY--; } render(); }
      if(id==="calNext"){ UI.calM++; if(UI.calM>11){ UI.calM=0; UI.calY++; } render(); }
      if(id==="addEmpBtn"){ UI.showEmpForm=true; UI.editEmp=null; render(); }
      if(id==="empCancel"){ UI.showEmpForm=false; UI.editEmp=null; render(); }
      if(id==="selfSave"){ var sp=document.getElementById("selfPick"); if(sp && sp.value){ S.settings.myEmpId=sp.value; save(); toast("Saved — you can now mark your attendance."); render(); } }
      if(id==="empSave"){
        var code=(document.getElementById("fCode").value||"").trim(), name=(document.getElementById("fName").value||"").trim();
        if(!code || !name){ toast("Employee ID and Name are required."); return; }
        var data={ code:code, name:name,
          dept:(document.getElementById("fDept").value||"").trim(), desig:(document.getElementById("fDesig").value||"").trim(),
          joining:document.getElementById("fJoin").value||"", salary:Math.max(0, +document.getElementById("fSalary").value||0) };
        if(UI.editEmp){ var ex=empByCode(UI.editEmp); if(ex){ ex.name=data.name; ex.dept=data.dept; ex.desig=data.desig; ex.joining=data.joining; ex.salary=data.salary; } toast("Employee updated."); }
        else {
          if(empByCode(code)){ toast("Employee ID already exists."); return; }
          S.employees.push(data); toast("Employee added.");
        }
        UI.showEmpForm=false; UI.editEmp=null; save(); render();
      }
      if(id==="expMonthly") exportMonthly();
      if(id==="expDaily") exportDaily();
      if(id==="expHours") exportHours();
      if(id==="expOT") exportOT();
      if(id==="expPrint") showPrint();
      if(id==="saveRules"){
        var std=parseHours(document.getElementById("sStd").value);
        if(std===null || std<=0){ toast("Enter standard hours like 8 or 8.5"); return; }
        S.settings.stdMin=std;
        var om=parseFloat(String(document.getElementById("sOtMult").value).replace(",","."));
        S.settings.otMultiplier = (isNaN(om)||om<0) ? 1 : om;
        S.settings.woPaid=document.getElementById("sWoPaid").checked;
        S.settings.leavePaid=document.getElementById("sLeavePaid").checked;
        save(); toast("Rules saved."); render();
      }
      if(id==="saveProfile"){
        S.settings.personalName=(document.getElementById("sPName").value||"My Attendance").trim()||"My Attendance";
        S.settings.personalSalary=Math.max(0, +document.getElementById("sPSalary").value||0);
        save(); toast("Profile saved."); render();
      }
      if(id==="saveRole"){
        S.settings.myEmpId=document.getElementById("sMyEmp").value||"";
        var pin=document.getElementById("sPin").value.trim();
        if(pin){ S.settings.pin=pin; UI.unlocked=true; toast("PIN set and role details saved."); }
        else toast("Role details saved.");
        save(); render();
      }
      if(id==="clearPin"){ S.settings.pin=""; save(); toast("PIN removed."); render(); }
      if(id==="backupBtn"){
        download("attendpro-backup-"+todayKey()+".json", JSON.stringify(S, null, 2), "application/json");
        toast("Backup downloaded.");
      }
      if(id==="restoreBtn"){ document.getElementById("restoreFile").click(); }
      if(id==="wipeBtn"){
        openModal('<h3>ERASE ALL DATA</h3><p class="muted">This deletes all employees, attendance, personal records and settings stored in this browser. This cannot be undone.</p>'+
          '<div class="rowflex" style="margin-top:1rem"><button type="button" class="btn red grow" id="wipeYes">Yes, Erase Everything</button><button type="button" class="btn ghost" id="wipeNo">Cancel</button></div>');
        document.getElementById("wipeNo").addEventListener("click", closeModal);
        document.getElementById("wipeYes").addEventListener("click", function(){
          S=defaultState(); UI.unlocked=false; save(); closeModal(); toast("All data erased."); UI.tab="dash"; render();
        });
      }
    });
    document.getElementById("restoreFile").addEventListener("change", function(e){
      var file=e.target.files[0]; if(!file) return;
      var reader=new FileReader();
      reader.onload=function(){
        try {
          var data=JSON.parse(reader.result);
          if(!data.settings || !data.att || !Array.isArray(data.employees)) throw new Error("bad");
          S=data; save(); UI.unlocked=false; toast("Backup restored."); maybeLock(); render();
        } catch(err){ toast("Invalid backup file."); }
        e.target.value="";
      };
      reader.readAsText(file);
    });

    /* ================= RENDER ================= */
    function render(){
      syncChrome();
      var v=document.getElementById("view"), html="";
      if(UI.tab==="dash") html=viewDashboard();
      else if(UI.tab==="mark") html=viewMark();
      else if(UI.tab==="emps") html=viewEmployees();
      else if(UI.tab==="cal") html=viewCalendar();
      else if(UI.tab==="rep") html=viewReports();
      else if(UI.tab==="set") html=viewSettings();
      v.innerHTML=html;
    }
    maybeLock();
    render();
    </script>
  </body>
</html>
